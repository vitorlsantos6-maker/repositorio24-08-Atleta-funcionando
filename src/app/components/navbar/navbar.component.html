<nav class="navbar">
  <div class="logo">
    <a routerLink="/">Equipamentos Bem estar</a>
  </div>

  <div class="search-box">
    <input 
      type="text" 
      placeholder="O que você procura?" 
      [(ngModel)]="termoPesquisa" 
      (keyup.enter)="buscar()"
    />
    <button (click)="buscar()">Buscar</button>
  </div>

  <div class="nav-actions">
    <button class="btn-auth-link" (click)="abrirModal('login')">Entrar</button>
    <button class="btn-auth-highlight" (click)="abrirModal('cadastro')">Cadastrar</button>

    <a routerLink="/carrinho" class="cart-icon">
      🛒 <span class="badge" *ngIf="quantidadeCarrinho > 0">{{ quantidadeCarrinho }}</span>
    </a>
  </div>
</nav>

<!-- Modal de Autenticação -->
<div class="modal-backdrop" *ngIf="exibirModalAuth" (click)="fecharModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <button class="btn-close" (click)="fecharModal()">&times;</button>

    <!-- Abas Alternadoras -->
    <div class="modal-tabs">
      <button [class.active]="modoModal === 'login'" (click)="modoModal = 'login'">Entrar</button>
      <button [class.active]="modoModal === 'cadastro'" (click)="modoModal = 'cadastro'">Criar Conta</button>
    </div>

    <!-- Formulário de Login -->
    <form *ngIf="modoModal === 'login'" (ngSubmit)="submeterLogin()">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" [(ngModel)]="loginData.email" name="loginEmail" required />
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" [(ngModel)]="loginData.senha" name="loginSenha" required />
      </div>
      <button type="submit" class="btn-submit">Entrar</button>
    </form>

    <!-- Formulário de Cadastro Completo -->
    <form *ngIf="modoModal === 'cadastro'" (ngSubmit)="submeterCadastro()">
      <div class="form-grid">
        <div class="form-group full-width">
          <label>Nome Completo</label>
          <input type="text" [(ngModel)]="cadastroData.nome" name="nome" required />
        </div>

        <div class="form-group">
          <label>CPF</label>
          <input type="text" [(ngModel)]="cadastroData.cpf" name="cpf" placeholder="000.000.000-00" required />
        </div>

        <div class="form-group">
          <label>Telefone</label>
          <input type="tel" [(ngModel)]="cadastroData.telefone" name="telefone" placeholder="(00) 00000-0000" required />
        </div>

        <div class="form-group full-width">
          <label>E-mail</label>
          <input type="email" [(ngModel)]="cadastroData.email" name="email" required />
        </div>

        <div class="form-group">
          <label>CEP</label>
          <input type="text" [(ngModel)]="cadastroData.cep" name="cep" (blur)="buscarCep()" placeholder="00000-000" required />
        </div>

        <div class="form-group">
          <label>Logradouro (Rua/Av.)</label>
          <input type="text" [(ngModel)]="cadastroData.logradouro" name="logradouro" required />
        </div>

        <div class="form-group">
          <label>Número</label>
          <input type="text" [(ngModel)]="cadastroData.numero" name="numero" required />
        </div>

        <div class="form-group">
          <label>Complemento</label>
          <input type="text" [(ngModel)]="cadastroData.complemento" name="complemento" placeholder="Apt, Bloco, etc." />
        </div>

        <div class="form-group">
          <label>Bairro</label>
          <input type="text" [(ngModel)]="cadastroData.bairro" name="bairro" required />
        </div>

        <div class="form-group">
          <label>Cidade</label>
          <input type="text" [(ngModel)]="cadastroData.cidade" name="cidade" required />
        </div>

        <div class="form-group">
          <label>UF</label>
          <select [(ngModel)]="cadastroData.uf" name="uf" required>
            <option value="" disabled>Selecione</option>
            <option *ngFor="let uf of ufs" [value]="uf">{{ uf }}</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label>Senha</label>
          <input type="password" [(ngModel)]="cadastroData.senha" name="senha" required />
        </div>
      </div>

      <button type="submit" class="btn-submit">Finalizar Cadastro</button>
    </form>
  </div>
</div>
