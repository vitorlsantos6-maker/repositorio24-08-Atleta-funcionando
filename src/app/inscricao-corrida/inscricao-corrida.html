<div class="card-inscricao">
  <div class="header-inscricao">
    <h2>Inscrição na Corrida</h2>
    <div class="preco-badge">
      <span class="label-preco">Valor da Inscrição:</span>
      <span class="valor-preco">R$ 89,00</span>
    </div>
  </div>

  <form (ngSubmit)="salvarInscricao()">
    <div class="campo">
      <label for="atleta">Nome Completo</label>
      <input type="text" id="atleta" [(ngModel)]="inscricao.atleta" name="atleta" placeholder="Informe o nome do atleta" required>
    </div>

    <div class="linha-dupla">
      <div class="campo">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" [(ngModel)]="inscricao.cpf" name="cpf" placeholder="000.000.000-00" required>
      </div>

      <div class="campo">
        <label for="dataNascimento">Data de Nascimento</label>
        <input type="date" id="dataNascimento" [(ngModel)]="inscricao.dataNascimento" name="dataNascimento" required>
      </div>
    </div>

    <div class="linha-dupla">
      <div class="campo">
        <label for="sexo">Sexo</label>
        <select id="sexo" [(ngModel)]="inscricao.sexo" name="sexo">
          <option value="M">Masculino</option>
          <option value="F">Feminino</option>
          <option value="N">Não se identificar</option>
        </select>
      </div>

      <div class="campo">
        <label for="cep">CEP</label>
        <input type="text" id="cep" [(ngModel)]="inscricao.cep" name="cep" placeholder="00000-000" required>
      </div>
    </div>

    <div class="campo">
      <label for="rua">Rua/Logradouro</label>
      <input type="text" id="rua" [(ngModel)]="inscricao.rua_logradouro" name="rua_logradouro" placeholder="Endereço do atleta" required>
    </div>

    <div class="linha-dupla">
      <div class="campo">
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" [(ngModel)]="inscricao.cidade" name="cidade" placeholder="Sua cidade" required>
      </div>

      <div class="campo campo-uf">
        <label for="uf">UF</label>
        <input type="text" id="uf" [(ngModel)]="inscricao.uf" name="uf" placeholder="UF" maxlength="2" required>
      </div>
    </div>

    <div class="linha-dupla">
      <div class="campo">
        <label for="corrida">Corrida</label>
        <input type="text" id="corrida" [(ngModel)]="inscricao.corrida" name="corrida" placeholder="Nome do evento/corrida" required>
      </div>

      <div class="campo">
        <label for="camiseta">Tamanho da Camiseta</label>
        <select id="camiseta" [(ngModel)]="inscricao.camiseta" name="camiseta">
          <option value="P">P</option>
          <option value="M">M</option>
          <option value="G">G</option>
          <option value="GG">GG</option>
        </select>
      </div>
    </div>

    <button type="submit">Confirmar e Pagar R$ 89,00</button>
  </form>
</div>
