<div class="card-inscricao">
  <h2>Inscrição na Corrida</h2>

  <form (ngSubmit)="salvarInscricao()">
    <div class="campo">
      <label>Atleta:</label>
      <input type="text" [(ngModel)]="inscricao.atleta" name="atleta" placeholder="Nome do atleta">
    </div>

    <div class="campo">
      <label>Corrida:</label>
      <input type="text" [(ngModel)]="inscricao.corrida" name="corrida" placeholder="Nome da corrida">
    </div>

    <div class="campo">
      <label>Tamanho da Camiseta:</label>
      <select [(ngModel)]="inscricao.camiseta" name="camiseta">
        <option value="P">P</option>
        <option value="M">M</option>
        <option value="G">G</option>
      </select>
    </div>

    <button type="submit">Salvar Inscrição</button>
  </form>
</div>
